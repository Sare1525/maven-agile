apiVersion: apps/v1
kind: Deployment
metadata:
  name: riviera-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: riviera
  template:
    metadata:
      labels:
        app: riviera
    spec:
      containers:
      - name: riviera-container
        image: sare1525/maven-agile:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: riviera-service
spec:
  type: NodePort
  selector:
    app: riviera
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30005
